<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>営業部 案件管理（手順から依頼）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F7;--surface:#FFFFFF;--ink:#1F2933;--muted:#5E6A75;--line:#D5DCE2;--line-soft:#E7ECF0;
  --navy:#2D4A63;--navy-ink:#FFFFFF;--navy-soft:#E8EEF3;--gold:#A2802E;--gold-soft:#F7F0E1;--red:#A33A3A;--red-soft:#F8E9E9;
  --shadow:0 1px 2px rgba(31,41,51,.06),0 3px 10px rgba(31,41,51,.05);
  --font:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#10161B;--surface:#172029;--ink:#E4E9EE;--muted:#9AA6B1;--line:#2B3742;--line-soft:#222D37;--navy:#8DB0CB;--navy-ink:#0E1620;--navy-soft:#1E2C39;--gold:#D5B160;--gold-soft:#2A2519;--red:#E38C8C;--red-soft:#3A2325;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10161B;--surface:#172029;--ink:#E4E9EE;--muted:#9AA6B1;--line:#2B3742;--line-soft:#222D37;--navy:#8DB0CB;--navy-ink:#0E1620;--navy-soft:#1E2C39;--gold:#D5B160;--gold-soft:#2A2519;--red:#E38C8C;--red-soft:#3A2325;--shadow:none;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.7}
a{color:var(--navy)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--surface)}
.topin{max-width:1240px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand b{display:block;color:var(--navy);font-size:17px;line-height:1.3}
.brand span{font-size:12px;color:var(--muted)}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
nav.tabs a{text-decoration:none;color:var(--ink);padding:5px 8px;border-radius:6px;font-size:14px;border:1px solid transparent;display:flex;flex-direction:column;line-height:1.3}
nav.tabs a b{font-weight:400;font-size:14.5px;display:flex;align-items:center;gap:5px;white-space:nowrap}
nav.tabs a small{font-size:10px;color:var(--muted);white-space:nowrap}
nav.tabs a[aria-current="page"] b{font-weight:700}
nav.tabs .cnt{font-style:normal;display:inline-block;min-width:18px;text-align:center;background:var(--red);color:#fff;border-radius:9px;font-size:11px;font-weight:700;padding:0 5px;line-height:17px}
nav.tabs a:hover{background:var(--navy-soft)}
nav.tabs a[hidden]{display:none}
nav.tabs a[aria-current="page"]{background:var(--navy-soft);color:var(--navy);font-weight:700;border-color:var(--line)}
.top .grow{flex:1}
.mode{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.mode b{color:var(--navy)}
main{max-width:1240px;margin:0 auto;padding:24px 20px 60px}
h1{font-size:23px;color:var(--navy);margin:0;line-height:1.4}
.vhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 16px;padding-bottom:12px;border-bottom:2px solid var(--navy)}
.vhead p{margin:4px 0 0;color:var(--muted);font-size:14px}
.btn{border:1px solid var(--navy);background:var(--surface);color:var(--navy);border-radius:6px;padding:7px 14px;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;white-space:nowrap}
.btn.primary{background:var(--navy);color:var(--navy-ink)}
.btn.quiet{border-color:var(--line);color:var(--muted);font-weight:400}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);padding:16px 18px;margin:0 0 16px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:0 0 16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);padding:12px 16px}
.kpi small{display:block;font-size:12px;color:var(--muted)}
.kpi b{font-size:26px;color:var(--navy);font-variant-numeric:tabular-nums}
.kpi.warn b{color:var(--red)}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 12px}
.filters select,.filters input{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 9px;font-size:14px}
.filters label{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 12px;font-size:13.5px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink);font-weight:700}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{background:var(--navy);color:var(--navy-ink);text-align:left;padding:8px 10px;white-space:nowrap;font-weight:700}
td{padding:9px 10px;border-top:1px solid var(--line-soft);vertical-align:top}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--navy-soft)}
td .sub{display:block;font-size:12.5px;color:var(--muted)}
.chip{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:10px;padding:0 8px;white-space:nowrap}
.chip.s{border-color:var(--navy);color:var(--navy)}
.chip.t{border-color:var(--gold);color:var(--gold)}
.chip.lost{border-color:var(--muted);color:var(--muted)}
.chip.done{background:var(--navy-soft);color:var(--navy)}
.bar{height:7px;background:var(--line-soft);border-radius:4px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--navy)}
.late{color:var(--red);font-weight:700}
.soon{color:var(--gold);font-weight:700}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
/* gantt */
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted);margin:0 0 10px;align-items:center}
.legend i{display:inline-block;width:22px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:5px}
.legend em{display:inline-block;width:9px;height:9px;border-radius:50%;vertical-align:0;margin-right:5px;font-style:normal}
.gw{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface);box-shadow:var(--shadow)}
.gt{position:relative}
.gh,.grw{display:flex;border-top:1px solid var(--line-soft)}
.gh{border-top:0;background:var(--navy);color:var(--navy-ink);font-size:12px;font-weight:700;position:sticky;top:0;z-index:3}
.gl{flex:0 0 260px;width:260px;position:sticky;left:0;z-index:2;background:var(--surface);padding:8px 12px;border-right:1px solid var(--line);cursor:pointer}
.gh .gl{background:var(--navy);color:var(--navy-ink);cursor:default;display:flex;align-items:flex-end}
.grw:hover .gl{background:var(--navy-soft)}
.gl b{display:block;font-size:13.5px;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gl small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gl .late{font-size:11.5px}
.gr{position:relative;flex:0 0 auto;min-height:64px}
.gh .gr{min-height:44px;height:44px}
.mlab{position:absolute;top:3px;font-size:12px;white-space:nowrap;padding-left:4px;border-left:1px solid rgba(255,255,255,.55);height:41px}
.dlab{position:absolute;top:24px;font-size:10.5px;font-weight:400;color:rgba(255,255,255,.85);transform:translateX(-50%);white-space:nowrap}
.vgrid2{position:absolute;top:0;bottom:0;border-left:1px dashed var(--line-soft)}
.wtick{position:absolute;bottom:0;height:10px;border-left:1px solid rgba(255,255,255,.3)}
.vgrid{position:absolute;top:0;bottom:0;border-left:1px solid var(--line-soft)}
.wkend{position:absolute;top:0;bottom:0;background:var(--bg);opacity:.7}
.tline{position:absolute;top:0;bottom:0;border-left:2px solid var(--gold);z-index:1}
.tlab{position:absolute;top:23px;font-size:11px;color:var(--navy);background:var(--gold);border-radius:3px;padding:0 5px;font-weight:700;transform:translateX(-50%);white-space:nowrap;z-index:2;line-height:16px}
.pbar{position:absolute;top:18px;height:20px;border-radius:4px;font-size:11px;line-height:20px;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar.done{background:var(--navy);color:var(--navy-ink)}
.pbar.cur{background:var(--gold-soft);border:2px solid var(--gold);line-height:16px;color:var(--ink);font-weight:700}
.pbar.fut{background:var(--navy-soft);border:1px solid var(--line);line-height:18px;color:var(--muted)}
.mk{position:absolute;top:44px;width:9px;height:9px;border-radius:50%;transform:translateX(-4.5px);z-index:1}
.mk.d{background:var(--navy)}
.mk.o{background:var(--surface);border:1.5px solid var(--navy)}
.mk.l{background:var(--red)}
.bmk{position:absolute;top:9px;width:8px;height:8px;background:var(--gold);transform:translateX(-4px) rotate(45deg);z-index:1}
.ball{display:block;margin-top:4px;font-size:12px;line-height:1.45;padding:3px 7px;border-radius:4px;background:var(--gold-soft);border-left:3px solid var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gl .ball b{display:inline;font-size:12px;color:var(--ink)}
.ball.late{background:var(--red-soft);border-left-color:var(--red);color:var(--ink)}
.ball.none{background:transparent;border-left-color:var(--line);color:var(--muted)}
.bchip{position:absolute;top:0;font-size:11px;font-weight:700;line-height:16px;padding:0 6px;border-radius:8px;background:var(--gold);color:#1F2933;transform:translateX(-50%);white-space:nowrap;z-index:2}
.bchip.late{background:var(--red);color:#fff}
.gl.wide{flex-basis:430px;width:430px;display:grid;grid-template-columns:52px minmax(0,1fr) 92px 74px;gap:6px;align-items:center;padding:6px 10px;cursor:default}
.gh .gl.wide{align-items:end}
.gl.wide .c1{font-weight:700;color:var(--navy);font-size:12px}
.gl.wide .c2{font-size:12.5px;line-height:1.4;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.gl.wide .c3{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gl.wide .c4{font-size:12px;text-align:right;white-space:nowrap}
.grw.ph .gl{background:var(--navy-soft)}
.grw.ph .gl.wide{grid-template-columns:1fr auto}
.grw.ph .gl b{color:var(--navy);font-size:13px}
.grw.sm .gr{min-height:38px}
.sbar{position:absolute;top:12px;height:14px;border-radius:3px}
.sbar.d{background:var(--navy)}
.sbar.c{background:var(--gold-soft);border:2px solid var(--gold)}
.sbar.l{background:var(--red-soft);border:2px solid var(--red)}
.sbar.f{background:var(--navy-soft);border:1px solid var(--line)}
.sdot{position:absolute;top:13px;width:10px;height:10px;transform:translateX(-5px) rotate(45deg);border:1.5px solid var(--muted);background:var(--surface)}
.gnote{position:absolute;left:12px;top:20px;font-size:12.5px;color:var(--muted);white-space:nowrap}
/* health, phases, compact steps */
.hl{display:inline-block;font-size:12px;font-weight:700;border-radius:10px;padding:0 9px;white-space:nowrap;border:1px solid var(--line)}
.hl.late{background:var(--red-soft);color:var(--red);border-color:var(--red)}
.hl.soon{background:var(--gold-soft);color:var(--gold);border-color:var(--gold)}
.hl.ok{background:var(--navy-soft);color:var(--navy)}
.hl.nodate{color:var(--muted);border-style:dashed;border-color:var(--muted);font-weight:400}
.phhead{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:9px 12px;margin:12px 0 6px;cursor:pointer;font-size:15px;font-weight:700;color:var(--navy);box-shadow:var(--shadow)}
.phhead .tri{flex:0 0 auto;width:0;height:0;border-left:7px solid var(--navy);border-top:5px solid transparent;border-bottom:5px solid transparent;transition:transform .15s}
.phhead[aria-expanded="true"] .tri{transform:rotate(90deg)}
.phhead .bar{flex:0 0 110px}
.phhead small{font-weight:400;color:var(--muted);font-size:12.5px}
.phhead .sp{flex:1}
.step .acts{display:flex;flex-direction:column;gap:4px;align-items:stretch}
.step .lwb{border:1px solid var(--gold);background:var(--gold-soft);border-radius:4px;font-size:12px;padding:2px 8px;cursor:pointer;color:var(--ink);white-space:nowrap;text-decoration:none;text-align:center;font-weight:700}
.step .lwb:hover{background:var(--gold);color:#1F2933}
.step .xb{border:1px solid var(--line);background:var(--surface);border-radius:4px;font-size:12px;padding:2px 8px;cursor:pointer;color:var(--navy);white-space:nowrap}
.step .xb[aria-expanded="true"]{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.step .panel{grid-column:1/-1;border-top:1px dashed var(--line);margin-top:6px;padding-top:10px;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px 16px}
.panel label{font-size:12px;font-weight:700;color:var(--navy)}
.panel label small{display:block;font-weight:400;color:var(--muted)}
.panel input,.panel select{display:block;width:100%;margin-top:3px;border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:var(--surface);font-size:13.5px}
.panel .wide{grid-column:1/-1}
.panel .man{grid-column:1/-1;background:var(--gold-soft);border-radius:6px;padding:10px 14px;font-size:13px;line-height:1.65}
.man b.t{color:var(--gold)}
.man h4{margin:8px 0 2px;font-size:12.5px;color:var(--navy)}
.man h4.w{color:var(--red)}
.man ul{margin:0;padding-left:1.1em}
.tg{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:8px;padding:0 6px;margin-left:6px;color:var(--muted);font-weight:400;white-space:nowrap}
td.ck{width:34px}
td.ck input{width:18px;height:18px;accent-color:var(--navy);cursor:pointer}
.homehead{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin:0 0 14px}
.homehead select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 9px;font-size:14px}
.nbadge{display:inline-block;text-decoration:none;font-size:13px;font-weight:700;color:var(--navy);border:1px solid var(--line);border-radius:14px;padding:2px 12px;margin-right:10px;background:var(--surface)}
.nbadge b{display:inline-block;min-width:18px;text-align:center;background:var(--red);color:#fff;border-radius:9px;font-size:11.5px;padding:0 5px;margin-left:5px}
.nbadge.zero b{background:var(--line);color:var(--muted)}
.ntc{list-style:none;margin:0;padding:0}
.ntc li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:9px 2px;border-top:1px solid var(--line-soft);font-size:14px;cursor:pointer}
.ntc li:first-child{border-top:0}
.ntc li.un{background:var(--gold-soft);margin:0 -10px;padding:9px 12px;border-radius:4px}
.ntc li small{color:var(--muted);font-size:12px}
.ntc li .nc{font-weight:700;color:var(--navy);font-size:13px}
.ntc li .nt{grid-column:1/-1}
.comp textarea{display:block;width:100%;min-height:150px;border:1px solid var(--line);border-radius:6px;padding:9px 11px;background:var(--surface);font-size:14px;line-height:1.7;margin-top:8px}
.comp h2{font-size:15px;color:var(--navy);margin:0 0 8px}
.comp .opt{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:13px;color:var(--muted)}
.linkbtn{display:inline-block;text-decoration:none;border:1px solid var(--navy);color:var(--navy);background:var(--surface);border-radius:6px;padding:6px 12px;font-size:13.5px;font-weight:700}
.linkbtn.off{border-style:dashed;border-color:var(--line);color:var(--muted);font-weight:400}
.doclist{list-style:none;margin:0;padding:0}
.doclist li{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line-soft);font-size:13.5px}
.doclist li:first-child{border-top:0}
.doclist li a{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.doclist li small{color:var(--muted);white-space:nowrap}
.doclist li button{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:12px;text-decoration:underline;padding:0}
.docadd{display:grid;grid-template-columns:1fr;gap:6px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.docadd input{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--surface);font-size:13.5px;width:100%}
.doctag{display:inline-block;font-size:11.5px;border:1px solid var(--navy);color:var(--navy);border-radius:8px;padding:0 7px;margin-left:6px;text-decoration:none;font-weight:700;white-space:nowrap}
.fbox{grid-column:1/-1;border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--surface)}
.fbox h4{margin:0 0 6px;font-size:12.5px;color:var(--navy)}
.frow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:7px 0;border-top:1px solid var(--line-soft)}
.frow:first-of-type{border-top:0}
.frow b{font-size:13.5px}
.frow small{display:block;color:var(--muted);font-size:12px}
.frow input{grid-column:1/-1;border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:var(--surface);font-size:13px;width:100%}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chips .chip button{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:0 0 0 4px;font-size:12px}
.fedit .fields{margin-bottom:10px}
.fbox textarea{display:block;width:100%;margin-top:3px;border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:var(--surface);font-size:13.5px;line-height:1.6}
.fbox .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px 14px;margin-bottom:10px}
.fbox .madd{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:6px;margin-top:6px;align-items:end}
.fbox .madd select,.fbox .madd input{margin-top:0}
.fbox .sent{font-size:12px;color:var(--muted);margin-top:6px}
.step .as .mem{font-size:11.5px;color:var(--muted);line-height:1.4;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
@media (max-width:640px){.fbox .madd{grid-template-columns:1fr}}
.mesel{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.mesel select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 8px;font-size:14px;color:var(--ink);font-weight:700}
.mesel select.none{border-color:var(--gold);background:var(--gold-soft)}
#newBtn{padding:6px 14px}
.setgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.setgrid textarea{display:block;width:100%;min-height:210px;border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--surface);font-size:14px;line-height:1.7;margin-top:4px}
.setgrid input{display:block;width:100%;border:1px solid var(--line);border-radius:6px;padding:6px 9px;background:var(--surface);font-size:14px;font-weight:700;color:var(--navy)}
.gsteps{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.gsteps button{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:6px 14px;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:7px;white-space:nowrap}

.notice.err{background:var(--red-soft);border-left-color:var(--red)}

.nextbox .big{font-size:16px;font-weight:700;margin:2px 0}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.backbar{display:flex;gap:14px;align-items:center;margin:0 0 12px}

  .dgrid{grid-template-columns:1fr}
  .board{grid-template-columns:repeat(4,minmax(240px,82vw))}
  .step{grid-template-columns:22px 50px minmax(0,1fr) auto}

  .step .memo{grid-column:2/-1}
  .gl{flex-basis:150px;width:150px;padding:8px}

  .topin{gap:8px}

@media (max-width: 640px){

  table.stack tr td:first-child{padding-top:10px} table.stack tr td:last-child{padding-bottom:10px}
}
@media print{header.top,.filters,.toolbar,.btn{display:none!important} body{background:#fff} .card,.tw,.step{box-shadow:none}}

印紙代、着手金）"], "n": ["営業担当者は質疑応答をまとめ、現場代理人に確認後に監理者へ送付し居住者への閲覧方法について確認する。", "※契約調印は稀に総会後の調印の場合もある。"]}, "s:11(4)": {"h": "説明会の1か月前に製本、2週間前に資料送付、調印後3日で完成保証、着工2か月前に着手金を請求する。", "d": ["経理課にて営業部に、着工1ヵ月前の物件に対して履行保証有無を確認している。", "営業担当者は、経営部に調印済契約書、契約見積書、工事履行保証書を提出して、手続きを依頼する。", "経理課は工事履行保証手続きをして、保証書を受領し、営業担当者、代理人にPDFを渡す。原本は経理保管している。"], "n": ["※完成保証人申請一覧表（Ex）にて管理"]}, "s:11(5)": {"h": "説明会の1か月前に製本、2週間前に資料送付、調印後3日で完成保証、着工2か月前に着手金を請求する。", "d": ["着手金がある場合には、営業担当者は「請求書発行依頼」を提出し、経理課は請求書を作成して営業担当者OR現場代理人へ渡す、または指示により管理会社へ直接送付"], "n": ["①営業担当者は経理から入金予定リストが届いてから5営業日以内に、管理組合・管理会社に振込手続き状況を確認し、案件管理アプリに記録してLINE WORKSで周知する。", "②請求書は紛失防止をするため管理会社へ直接送れるように1回目の理事会で管理組合の承諾を得る。", "③入金遅延がある場合は営業部長から経営部長へ報告、経営部長は社長、経理課に共有する", "※アフターメンテナンス部も同様の確認フローとする。"]}, "s:11(8)": {"h": "説明会の1か月前に製本、2週間前に資料送付、調印後3日で完成保証、着工2か月前に着手金を請求する。", "d": ["経理にて発行した請求書を第一回目の着工前MTGで発注者に渡す。"], "n": []}, "s:15": {"h": "タイル・アスベスト・色決めなどの着工前準備を営業が進め、完了を工事部へ報告する。", "d": [], "n": ["営業担当者が都合により現地に行けない場合は、現場代理人が現地対応を行う", "決定までを営業が行いタイルの発注は工事部が行う"]}, "s:15(1)": {"h": "タイル・アスベスト・色決めなどの着工前準備を営業が進め、完了を工事部へ報告する。", "d": ["①着工前事前準備", "アスベスト検体調査→採取→分析依頼→結果", "タイル見本焼き→本焼き", "カラーシミュレーション（無い場合もある）", "②タイルの採取日・見本焼き及び組合確認日・色決定の確認をする。", "※タイル本焼き→3ヶ月（タイルの種類によって大きく変わる）"], "n": ["営業担当者が都合により現地に行けない場合は、現場代理人が現地対応を行う", "決定までを営業が行いタイルの発注は工事部が行う"]}, "s:15(2)": {"h": "タイル・アスベスト・色決めなどの着工前準備を営業が進め、完了を工事部へ報告する。", "d": ["現場代理人は進捗確認をし、期限超過の場合は工事部課長に報告し、工事部課長は営業1課長に催促する。"], "n": []}, "s:16": {"h": "工事部から頼まれたら、営業担当者が発注者に現地確認の日を取る。", "d": [], "n": []}, "s:16(2)": {"h": "工事部から頼まれたら、営業担当者が発注者に現地確認の日を取る。", "d": ["営業担当者は発注者に対して事前調査日を依頼する。"], "n": []}, "s:20": {"h": "工事部が着工40日前に開く会議。50万円以上の過不足は営業予算変更願いで社長承認を取る。", "d": [], "n": ["工事部課長にて収支を確認、予算作成に於ける予算漏れ等を防ぐ。", "見積担当者、工事部長、工事課長", "営業予算変更願は、営業より着工前MTG開催後、7営業日以内に工事部長に返答し、各課長より代理人への通達とする。原本・過不足の詳細資料を工事部長に提出をする。", "※不足分だけでなく、増加や余剰があった場合も同様に報告する。", "決定内容は各課長より代理人へ通達する。", "工事部課長の参加必須"]}, "s:20(1)": {"h": "工事部が着工40日前に開く会議。50万円以上の過不足は営業予算変更願いで社長承認を取る。", "d": ["LINE WORKSにて以下メンバー引継Groupメンバーを招集する。", "出席者", "見積担当者・営業担当・現場代理人・工事部課長"], "n": ["工事部課長にて収支を確認、予算作成に於ける予算漏れ等を防ぐ。", "見積担当者、工事部長、工事課長"]}, "s:20(3)": {"h": "工事部が着工40日前に開く会議。50万円以上の過不足は営業予算変更願いで社長承認を取る。", "d": ["議案書に基づき進行し、終了後は、LINE WORKSに現場代理人が議事録を添付する。"], "n": []}, "s:20(4)": {"h": "工事部が着工40日前に開く会議。50万円以上の過不足は営業予算変更願いで社長承認を取る。", "d": ["着工前MTGに於いて営業見積に￥500,000以上の「不足・抜け・仕様変更の必要・懸念」項目がある場合、営業・見積担当者と内容の確認と精査を行う。現場代理人は契約時利益の変更を工事課長・営業課長に依頼する。"], "n": ["営業予算変更願は、営業より着工前MTG開催後、7営業日以内に工事部長に返答し、各課長より代理人への通達とする。原本・過不足の詳細資料を工事部長に提出をする。", "※不足分だけでなく、増加や余剰があった場合も同様に報告する。"]}, "s:20(5)": {"h": "工事部が着工40日前に開く会議。50万円以上の過不足は営業予算変更願いで社長承認を取る。", "d": ["営業課長は着工前MTGで検討した内容で「営業予算変更願い」を営業部長・工事部長に提出し内容を確認してもらう。工事部長は決定内容を社長に提出し、承認を得る。変更があった場合、現場代理人は変更後利益率にて「実行予算承認願い」を提出する。"], "n": ["決定内容は各課長より代理人へ通達する。"]}, "s:20(6)": {"h": "工事部が着工40日前に開く会議。50万円以上の過不足は営業予算変更願いで社長承認を取る。", "d": ["着工前MTG終了時（同日）に参加者で目標利益率を決定する。", "承認後は着工後月末/月に収支確認の上、現場で工事部課長が確認した上で収支資料を提出する。"], "n": ["工事部課長の参加必須", "承認後は目標利益率1％の減額までは工事部課長の範囲とし、それより下がる場合は工事部長が事業部長にその旨を通知する。", "承認を受けた実行予算承認願いはBox各物件フォルダ→86旧DCデータ→予算にPDFを格納する", "※実行予算承認願いの承認をもって発注書の発行を可能とする。", "※営業予算変更願いの返答後、原本を部長保管とし、現場代理人は各物件フォルダ→86旧DCデータ→予算にPDFファイルを格納する"]}, "s:21": {"h": "協力会社の現地調査も、必ず営業担当者を通じて監理者・組合の承諾を取る。", "d": [], "n": ["注意事項①必ず営業担当通じて監理者/管理組合に承諾を得る"]}, "s:21(2)": {"h": "協力会社の現地調査も、必ず営業担当者を通じて監理者・組合の承諾を取る。", "d": ["営業担当者は発注者に対して事前調査日を依頼する。"], "n": ["注意事項①必ず営業担当通じて監理者/管理組合に承諾を得る"]}, "s:23": {"h": "着工30日前までに駐車場を押さえ、発注者との事前MTGに現場代理人と同席する。", "d": [], "n": ["加入後は現場代理人、担当課長、工事部事務へ共有", "※10-(1)と同内容　参照のこと"]}, "s:23(2)": {"h": "着工30日前までに駐車場を押さえ、発注者との事前MTGに現場代理人と同席する。", "d": ["①単独有期保険申請（1億8000万円税別以上）の契約金額の場合に申請が必要。", "経営部は契約書調印後に顧問社労士に申請依頼をする。", "※申請後契約書はBox物件フォルダ60番へ格納"], "n": ["加入後は現場代理人、担当課長、工事部事務へ共有"]}, "s:23(3)": {"h": "着工30日前までに駐車場を押さえ、発注者との事前MTGに現場代理人と同席する。", "d": ["仮設計画で定められた居住者用移動車両と", "工事で必要な駐車場を確保する。"], "n": []}, "s:23(6)": {"h": "着工30日前までに駐車場を押さえ、発注者との事前MTGに現場代理人と同席する。", "d": ["①着工前に工事説明会資料、契約内容の確認の際に、営業と共に現場代理人はMTGに参加し、今後の進め方を共有する。", "※特に仮設設置位置については十分協議する。", "※着工後の定例日の設定※原則土曜日で設定し、日曜日はお休みであることを主張する。（営業と共に）", "②瑕疵担保責任保険受理後、検査チェックシートが送付されたあとに検査日程の承認を発注者から得る。(営業事務）", "③第一回請求書を渡す。（営業担当者）", "④車・自転車の移動については管理会社が介入しないように直接やりとりできるように打診する。"], "n": ["※10-(1)と同内容　参照のこと"]}, "s:25": {"h": "営業部長が工事説明会の出席者を決める（着工30〜14日前）。", "d": [], "n": ["※工事説明会資料に芝生の枯れについて記載してほしい。", "※工事説明会前までにkintoneお知らせで代理人紹介"]}, "s:25(1)": {"h": "営業部長が工事説明会の出席者を決める（着工30〜14日前）。", "d": ["状況に応じて現場代理人・営業担当者だけでなく、上席の参加を検討し、工事部課長に打診する。"], "n": ["※工事説明会資料に芝生の枯れについて記載してほしい。", "※工事説明会前までにkintoneお知らせで代理人紹介"]}, "s:29": {"h": "工事部長から連絡を受けたら、営業部長が監理者・発注者・管理会社へ連絡し、対応後に工事部長へ共有する。", "d": [], "n": ["各部長は関係する課長、担当へ情報を共有する", "休日対応は最寄りの対応可能な工事部員が確認に向かい、対応者の選定は部長もしくは指名した代理の者が行う。", "対応後、工事部長に共有。工事部長より現場に指示出しを行う。"]}, "s:38": {"h": "営業担当者が請求書発行依頼を出し、入金状況を5営業日以内に確かめる。", "d": [], "n": ["注意事項", "①現場代理人は、時期をみて管理組合に確認する、また営業は工事部より報告（毎月15日）される課別収支報告一覧より請求時期を確認する。", "②営業担当者は請求書のお渡し時期は管理組合／管理会社によって条件が異なる為、いつ頃請求書をお渡しする必要があるのかを事前に確認しておくこと、", "③営業担当者は経理から入金予定リストが届いてから5営業日以内に、管理組合・管理会社に振込手続き状況を確認し営業部長へ報告", "④入金遅延がある場合は営業部長から社長、経営部長へ報告", "※アフターメンテナンス部も同様の確認フローとする"]}, "s:38(1)": {"h": "営業担当者が請求書発行依頼を出し、入金状況を5営業日以内に確かめる。", "d": ["中間金がある場合には、営業担当者は「請求書発行依頼」を提出し、経理課は請求書を作成して営業担当者OR現場代理人へ渡す、または指示により管理会社へ直接送付"], "n": ["注意事項", "①現場代理人は、時期をみて管理組合に確認する、また営業は工事部より報告（毎月15日）される課別収支報告一覧より請求時期を確認する。", "②営業担当者は請求書のお渡し時期は管理組合／管理会社によって条件が異なる為、いつ頃請求書をお渡しする必要があるのかを事前に確認しておくこと、", "③営業担当者は経理から入金予定リストが届いてから5営業日以内に、管理組合・管理会社に振込手続き状況を確認し営業部長へ報告", "④入金遅延がある場合は営業部長から社長、経営部長へ報告", "※アフターメンテナンス部も同様の確認フローとする"]}, "s:43": {"h": "工期延長は工事部から報告が来る。社長承認後、変更契約の提出に営業担当者が同席する。", "d": [], "n": ["工期の延長による支払い、請求時期の変更等が発生する場合は変更契約書を作成する。", "変更契約書作成、kintone工期変更は工事部事務にて行う。"]}, "s:43(1)": {"h": "工期延長は工事部から報告が来る。社長承認後、変更契約の提出に営業担当者が同席する。", "d": ["追加工事、実数精算工事の増加等により工期の延長が必要となった場合、現場代理人→工事部課長→工事部長・営業部長・経営部長に報告し、内容が妥当と判断されれば稟議申請を行い、変更契約書(案)を管理組合へ提出。（営業担当者が同席）"], "n": ["工期の延長による支払い、請求時期の変更等が発生する場合は変更契約書を作成する。", "変更契約書作成、kintone工期変更は工事部事務にて行う。"]}, "s:45": {"h": "クレームは工事部が対応し、営業担当者へ共有される。", "d": [], "n": ["kintoneを経由していないクレームは、対応の記録を行う。", "クレームの対応は迅速に行い、対応結果や対応状況の入力は1日以内にkintoneの入力を行う。(継続対応が必要な場合も対応状況と今後の対応等を1日以内に入力し上長に報告する)"]}, "s:45(1)": {"h": "クレームは工事部が対応し、営業担当者へ共有される。", "d": ["工事中に発生したクレームについては、情報共有として所属上長に報告する。対応が困難な場合は上長と対応を検討し、工事部長に報告する。"], "n": ["kintoneを経由していないクレームは、対応の記録を行う。", "クレームの対応は迅速に行い、対応結果や対応状況の入力は1日以内にkintoneの入力を行う。(継続対応が必要な場合も対応状況と今後の対応等を1日以内に入力し上長に報告する)"]}, "s:58": {"h": "経営部が中間金の請求時期を記録する（営業部は入金遅延の確認に使う）。", "d": [], "n": ["入金遅延等の確認"]}, "s:58(3)": {"h": "経営部が中間金の請求時期を記録する（営業部は入金遅延の確認に使う）。", "d": ["経営部は、報告された内容を「大規模修繕工事入金予定一覧」に記録する。"], "n": ["入金遅延等の確認"]}, "s:60": {"h": "変更契約の内容は、押印前に営業担当者・営業部長へ共有される。", "d": [], "n": ["追加増減内容を社内へ共有（kintone 工事アプリ入力・実行予算書へ入力）"]}, "s:60(3)": {"h": "変更契約の内容は、押印前に営業担当者・営業部長へ共有される。", "d": ["工事変更情報の共有（見える化）"], "n": ["追加増減内容を社内へ共有（kintone 工事アプリ入力・実行予算書へ入力）"]}, "s:61": {"h": "最終金も請求書発行依頼で。請求時期は毎月15日の課別収支報告一覧で確かめる。", "d": [], "n": ["注意事項", "①代理人は営業からの打診を待たず、時期をみて営業担当に確認する,営業は工事部より報告（毎月15日）される課別収支報告一覧より請求時期を確認する。", "②請求書のお渡し時期は管理組合／管理会社によって条件が異なる為、いつ頃請求書をお渡しする必要があるのかを事前に確認しておくこと", "③一ヶ月後に最終金請求がある現場もあるため注意が必要"]}, "s:61(1)": {"h": "最終金も請求書発行依頼で。請求時期は毎月15日の課別収支報告一覧で確かめる。", "d": ["最終金は、営業担当者は「請求書発行依頼」を提出し、経理課は請求書を作成して営業担当者OR現場代理人へ渡す、または指示により管理会社へ直接送付"], "n": ["注意事項", "①代理人は営業からの打診を待たず、時期をみて営業担当に確認する,営業は工事部より報告（毎月15日）される課別収支報告一覧より請求時期を確認する。", "②請求書のお渡し時期は管理組合／管理会社によって条件が異なる為、いつ頃請求書をお渡しする必要があるのかを事前に確認しておくこと", "③一ヶ月後に最終金請求がある現場もあるため注意が必要"]}, "s:63": {"h": "竣工図書は工事部が提出10日前に回覧する。", "d": [], "n": []}, "s:63(2)": {"h": "竣工図書は工事部が提出10日前に回覧する。", "d": ["工事課長→工事部長の順で回覧"], "n": []}, "s:64": {"h": "竣工後7営業日で、営業部長も工事竣工引受け書を確認する。", "d": [], "n": ["現場代理人は各物件フォルダ内「60契約書類」に格納"]}, "s:64(1)": {"h": "竣工後7営業日で、営業部長も工事竣工引受け書を確認する。", "d": ["工事部長、営業部長、経営部長は、工事竣工引き受け書を確認する。"], "n": ["現場代理人は各物件フォルダ内「60契約書類」に格納"]}, "s:65": {"h": "現場代理人の報告をもとに営業部が完了金の請求書発行依頼を作り、営業部長が承認する。", "d": [], "n": []}, "s:65(1)": {"h": "現場代理人の報告をもとに営業部が完了金の請求書発行依頼を作り、営業部長が承認する。", "d": ["現場代理人は追加（減額）工事に関して営業部に報告し、営業部は、最終金請求書発行依頼を作成し、営業部長の承認を得た上で、経営部に提出する。", "最終請求金額が契約書記載内容と異なる場合は、変更契約書または注文書を確認する。"], "n": []}, "s:67": {"h": "歩掛表は竣工後60日以内に入力され、第3課 課長が承認して次の見積に生かす。", "d": [], "n": ["竣工引継ぎ書にて提出", "【53期の運用】第3課 課長（太田）が不在のときは、第3課リーダー（高橋・上田）が代理で承認する"]}, "s:67(4)": {"h": "歩掛表は竣工後60日以内に入力され、第3課 課長が承認して次の見積に生かす。", "d": ["新出勤簿をもとに歩掛表に入力を行う。", "各工種各工法ごとに歩掛表のデータ取りを行い、見積時に正確な原価を出し、太陽の競争力を高め、より効率的な利益確保を目的としているため、更新都度、営業部に情報共有を行う。"], "n": ["竣工引継ぎ書にて提出", "【53期の運用】第3課 課長（太田）が不在のときは、第3課リーダー（高橋・上田）が代理で承認する"]}, "s:68": {"h": "竣工後MTGの指摘には、営業部長が7営業日以内に工事部長へ返答する。", "d": [], "n": ["※工事部総括", "営業利益への返答は、営業より竣工後MTG開催後、7営業日以内に営業部長より工事部長に返答し、各課長より代理人への通達とする。原本を工事部長に提出をする。"]}, "s:68(4)": {"h": "竣工後MTGの指摘には、営業部長が7営業日以内に工事部長へ返答する。", "d": ["竣工現場について引継ぎ内容を基に物件の報告・引継ぎを実施する。"], "n": ["※工事部総括"]}, "s:68(5)": {"h": "竣工後MTGの指摘には、営業部長が7営業日以内に工事部長へ返答する。", "d": ["竣工後MTGに於いて営業見積に「不足・抜け・仕様変更の必要・懸念」項目があり、営業予定利益を変更するに妥当と思しき場合、工事部役職　営業・見積担当者　社長と協議の上、契約時利益の変更を営業部長より返答を受け、kintoneへ反映とともに工事部長に返答を行う"], "n": ["営業利益への返答は、営業より竣工後MTG開催後、7営業日以内に営業部長より工事部長に返答し、各課長より代理人への通達とする。原本を工事部長に提出をする。"]}, "s:70": {"h": "メンテ部がkintoneのメンテ期間を契約書・竣工図書と照合する。登録は営業担当者。", "d": [], "n": ["齟齬がある場合は営業部長と工事部長で協議し決定する。"]}, "s:70(1)": {"h": "メンテ部がkintoneのメンテ期間を契約書・竣工図書と照合する。登録は営業担当者。", "d": ["営業がkintoneに登録したメンテナンス期間が正しいかの確認を行う。契約書と竣工図書の両方を見比べて必要に応じて修正する。"], "n": ["齟齬がある場合は営業部長と工事部長で協議し決定する。"]}, "s:72": {"h": "次の大規模修繕を見込むときは、営業部長が理事会へ説明に行く。", "d": [], "n": ["保証切れ案件の確認・未施工工事の確認", "工事中の提出した見積もりがBox80番に入っていることを確認する。", "理事会に提出資料があればBoxの各物件＞90メンテナンスに格納する。"]}, "s:72(6)": {"h": "次の大規模修繕を見込むときは、営業部長が理事会へ説明に行く。", "d": ["管理組合に求められた場合　もしくは次の大規模修繕工事や大型工事の受注を見込む場合は直接説明にいくことがある。"], "n": ["保証切れ案件の確認・未施工工事の確認", "工事中の提出した見積もりがBox80番に入っていることを確認する。", "理事会に提出資料があればBoxの各物件＞90メンテナンスに格納する。"]}, "s:73": {"h": "入金は経理課がkintoneで知らせる。未入金は経理課→営業部長→営業担当者の順で催促が回る。", "d": [], "n": ["※注　【未入金催促ルート】", "経理課→経営部長→営業部長→営業担当→営業部長→経営部長→経理", "迅速な対応が必要"]}, "s:73(1)": {"h": "入金は経理課がkintoneで知らせる。未入金は経理課→営業部長→営業担当者の順で催促が回る。", "d": ["経営部は、入金情報をkintoneに入力することにより営業担当者、現場代理人に連絡する。"], "n": []}, "s:73(2)": {"h": "入金は経理課がkintoneで知らせる。未入金は経理課→営業部長→営業担当者の順で催促が回る。", "d": ["経営部は、入金状況を大規模修繕工事入金予定一覧に入力する。"], "n": []}, "s:73(3)": {"h": "入金は経理課がkintoneで知らせる。未入金は経理課→営業部長→営業担当者の順で催促が回る。", "d": ["経営部は、毎月月初に、未入金の場合に各担当者に連絡し、催促を促す。会長、社長、営業、工事部部門長に共有。各担当者より催促してもなお未入金の場合は、再度担当者に連絡し、状況確認する。", "各担当者より催促してもなお未入金の場合は、経営部が催促する。"], "n": ["※注　【未入金催促ルート】", "経理課→経営部長→営業部長→営業担当→営業部長→経営部長→経理", "迅速な対応が必要"]}, "s:73(4)": {"h": "入金は経理課がkintoneで知らせる。未入金は経理課→営業部長→営業担当者の順で催促が回る。", "d": ["経理課は毎月月初に前月入金一覧表と未入金一覧表を提出する。", "経営部は、資金状況、当月入金予定を社長に報告書を上げる。"], "n": []}, "s:75": {"h": "各部長が月1回、経営層に収支を報告する。", "d": [], "n": ["請求書ベース　実行された入金ベースにて収支報告を実施"]}, "s:75(1)": {"h": "各部長が月1回、経営層に収支を報告する。", "d": ["各部門長は、月次の収支報告会にて、経営層に収支の報告をする"], "n": ["請求書ベース　実行された入金ベースにて収支報告を実施"]}, "t:①-1": {"h": "営業部第1課が案件情報をkintoneに入れて承認を取り、2営業日以内に周知・グループ作成・担当者任命まで済ませる。", "d": ["引継ぎ情報の作成・承認", "営業部による受注確度・物件情報・発注者情報・契約条件・仕様要件のkintone引継ぎ様式への入力", "上長承認を経た営業部第2課への正式引継ぎ", "承認前は『仮』情報として取り扱い"], "n": ["未承認のまま次工程へ進まないこと", "受注確度の定義はkintone基準に統一（売上管理表と混在禁止）", "※kintone引継情報承認をもって正式引継", "※不足時は営業部へ差戻し", "入力者と承認者を分け、承認者は金額・工期・仕様の妥当性まで確認すること", "引継ぎ漏れは見積・発注・請求に直結するため、チェックリスト4項目（物件／発注者／契約条件／仕様要件）の充足を必ず確認すること"]}, "t:①-2": {"h": "営業部第1課が案件情報をkintoneに入れて承認を取り、2営業日以内に周知・グループ作成・担当者任命まで済ませる。", "d": ["工事内定書のkintone承認後、阿部取締役による工事番号の取得", "kintoneへの工事番号入力", "※データ入力・請求入金の基本情報", "工事内定書承認後の阿部取締役による工事番号の採番、kintone及び会計ソフトへの工事番号・住所・工期・担当者の登録"], "n": ["会計ソフトに工事番号・住所・工期・担当者情報を入力", "工事番号は原価／請求／入金を紐づける基本キーであり、採番遅れは全工程を止める点に留意すること", "番号未取得のまま先行発注・先行手配を行わないこと"]}, "t:①-3": {"h": "営業部第1課が案件情報をkintoneに入れて承認を取り、2営業日以内に周知・グループ作成・担当者任命まで済ませる。", "d": ["LINEWORKS全体グループへの案件発生の周知", "第2課・製造・工事・経営の関係部署への初期情報の共有"], "n": ["周知が2営業日を超える場合は理由を添えて営業部部長へ事前報告すること", "確定前でも『確認中』として暫定共有し、確定後に更新する（情報の停滞を防ぐ）"]}, "t:①-4": {"h": "営業部第1課が案件情報をkintoneに入れて承認を取り、2営業日以内に周知・グループ作成・担当者任命まで済ませる。", "d": ["LINEWORKS「戦略TEAM」Groupの作成", "営業部事務による案件専用グループの作成、営業部全員・営業部部長・工事部課長・製造開発部長・経営部課長の初期メンバー登録", "代理人予定者が決まり次第の追加", "グループ名は命名規則に統一"], "n": ["グループ名の命名規則を守り統一すること（例：○○ロードヒーティング設置工事）", "※案件獲得時に営業部が発注者の窓口・キーパーソン・経緯をkintoneに詳細記録", "※LINEWORKS全体グループ作成は営業部事務", "※代理人予定者が決まった際にその課長を追加", "※支払い条件を経理に共有", "代理人予定者が決まったら速やかにグループ追加すること", "議事録は当日〜1営業日以内に投稿し、欠席者には48時間以内に内容確認・異議申立ての機会を設けること"]}, "t:①-5": {"h": "営業部第1課が案件情報をkint function phaseWindows(c){const d=c.dates||{};const W=[null,null,null,null];
 if(c.type==='s'){const ch=pd(d.chosa),te=pd(d.teishutsu),ka=pd(d.kanaitei),ck=pd(d.chakko),sh=pd(d.shunko);
  const s0=ch||(te?addD(te,-21):null),e0=ka||(te?addD(te,3):null);if(s0&&e0)W[0]=[s0,e0];
  const s1=ka||e0;if(s1&&ck)W[1]=[s1,ck];if(ck&&sh)W[2]=[ck,sh];if(sh)W[3]=[sh,addD(sh,60)];}
 else{const inf=pd(d.ts_info),ch=pd(d.ts_chosa),ck=pd(d.ts_chakko),sh=pd(d.ts_shunko);
  if(inf&&ch)W[0]=[inf,addB(ch,1)];if(ch)W[1]=[ch,addB(ch,14)];if(ch&&ck)W[2]=[addB(ch,14),addB(ck,-14)];if(ck)W[3]=[addB(ck,-14),sh||addD(ck,30)];}

function timeline(dates){let mn=null,mx=null;dates.forEach(d=>{if(!d)return;if(!mn||d<mn)mn=d;if(!mx||d>mx)mx=d;});
 const t0=today();if(!mn){mn=t0;mx=t0;}if(t0<mn)mn=t0;if(t0>mx)mx=t0;
 const start=addD(mn,-7),end=addD(mx,14);const days=Math.round((end-start)/864e5)+1;
 const px=UI.zoom==='week'?14:(UI.zoom==='month'?5:Math.max(1.4,880/days));
 const X=d=>Math.round((d-start)/864e5*px);const W=days*px;const tx=X(t0)+px/2;
 let head='',grid='';let m=new Date(Date.UTC(start.getUTCFullYear(),start.getUTCMonth(),1));
 while(m<=end){const x=X(m);if(x>=0)grid+=`<span class="vgrid" style="left:${x}px"></span>`;head+=`<span class="mlab" style="left:${Math.max(0,x)}px">${m.getUTCFullYear()}年${m.getUTCMonth()+1}月</span>`;m=addM(m,1);}
 const showDay=px*9>=20;
 for(let i=0;i<days;i++){const d=addD(start,i);const dd=d.getUTCDate();const x=i*px+px/2;
  if(showDay&&(dd===1||dd===10||dd===20||(dd===30&&px>=12))){if(Math.abs(x-tx)>22)head+=`<span class="dlab" style="left:${x}px">${dd}日</span>`;if(dd!==1)grid+=`<span class="vgrid2" style="left:${i*px}px"></span>`;}

 head+=`<span class="tlab" style="left:${tx}px">今日</span>`;
 return {start,end,px,X,W,tx,head,grid};}

function V_caseGantt(c){

 const ds=[];ws.forEach(w=>{if(w)ds.push(w[0],w[1]);});const dues={};t.items.forEach(it=>{const r=dueOf(c,it);if(r){dues[it.k]=r;ds.push(r.d);}});

function manRoute(c,it){const m=D.manMap[it.k];return m?`#m-${c.type}-${m[0]}-${it.k}`:'';}
function V_manual(r){const p=r.split('-');const ty=p[1],gi=+p[2],sk=p[3]||'';const g=(D.man2[ty]||[])[gi];
 if(!g)return `<div class="card empty"><b>マニュアルのページが見つかりません</b><p><a href="#cases">案件の一覧へ</a></p></div>`;
 const fsub=sk&&D.manMap[sk]?D.manMap[sk][1]:'';const isF=s=>fsub&&(s===fsub||s.endsWith(fsub));const hasBack=STACK.length>0;
 const dos=g.rows.filter(x=>x.c.length),nts=g.rows.filter(x=>x.n.length),recs=g.rows.filter(x=>x.doc||x.tab||x.chk);
 const li=(x,arr)=>`<li class="${isF(x.sub)?'focus':''}"><strong>${esc(x.sub)} ${esc(x.todo)}</strong>${arr.map(l=>`<span>${esc(l)}</span>`).join('')}</li>`;
 return `<div class="mpage"><div class="vhead"><div><h1>${esc(g.pre)}${esc(g.no)}　${esc(g.name)}</h1><p>${esc(T[ty].name)}のマニュアル${fsub?'（金色の行が、いま見ている手順です）':''}</p></div>
 <div class="toolbar" style="margin:0">${hasBack?'<button type="button" class="btn primary" data-back>案件管理に戻る</button>':'<a class="btn primary" href="#cases">案件の一覧へ</a>'}<a class="btn quiet" href="${D.manualUrl}#${T[ty].manual[Math.min(T[ty].manual.length-1,(T[ty].items.find(x=>x.k===sk)||{ph:0}).ph)]}" target="_blank" rel="noopener">マニュアル全体を別のタブで開く</a></div></div>
 ${g.hit?`<p class="hit"><b>ひとことで</b>${esc(g.hit)}</p>`:''}
 <div class="tw"><table class="stack"><thead><tr><th>手順</th><th>To Do</th><th>担当（誰が）</th><th>誰に</th><th>承認</th><th>期限</th><th>kintone</th></tr></thead><tbody>${g.rows.map(x=>`<tr class="${isF(x.sub)?'focus':''}"><td data-l="手順" style="white-space:nowrap;color:var(--navy);font-weight:700">${esc(x.sub)}</td><td data-l="To Do"><b>${esc(x.todo)}</b></td><td data-l="担当">${esc(x.tanto)}</td><td data-l="誰に">${esc(x.to)}</td><td data-l="承認" style="color:var(--red)">${esc(x.appr)}</td><td data-l="期限">${esc(x.timing)}</td><td data-l="kintone">${esc(x.kin)}</td></tr>`).join('')}</tbody></table></div>
 <div class="card"><div class="cols">${dos.length?`<div><h3>やること</h3><ul>${dos.map(x=>li(x,x.c)).join('')}</ul></div>`:''}${nts.length?`<div><h3 class="w">注意</h3><ul>${nts.map(x=>li(x,x.n)).join('')}</ul></div>`:''}</div>${!dos.length&&!nts.length?'<p style="margin:0;color:var(--muted)">この工程には、やること・注意の記載がありません。</p>':''}</div>
 ${recs.length?`<h2 class="sect">使う帳票・記録先・チェック</h2><div class="tw"><table class="stack"><thead><tr><th>手順</th><th>帳票・データ</th><th>kintoneのタブ</th><th>順守チェッカー</th></tr></thead><tbody>${recs.map(x=>`<tr class="${isF(x.sub)?'focus':''}"><td data-l="手順"><b>${esc(x.sub)} ${esc(x.todo)}</b></td><td data-l="帳票">${esc(x.doc||'—')}</td><td data-l="タブ">${esc(x.tab||'—')}</td><td data-l="チェッカー">${esc(x.chk||'—')}</td></tr>`).join('')}</tbody></table></div>`:''}
 <div class="backbig">${hasBack?'<button type="button" class="btn primary" data-back>案件管理に戻る（元の手順へ）</button>':'<a class="btn primary" href="#cases">案件の一覧へ</a>'}</div></div>`;}

/* ---------- requests: every request inside the sales department is raised here */
const QKEY='taiyo-case-app2-reqs-v1';
const RKINDS=['積算・見積の依頼','資料・提案書の作成','現地調査・同行','事務手続き（申込・保険・請求など）','確認・承認の依頼','その他'];
const RST={open:'依頼中',accepted:'対応中',done:'完了報告あり',closed:'完了',returned:'差し戻し',cancelled:'取り下げ'};
function reqNo(r){const d=new Date(r.createdAt||Date.now());return 'R'+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'-'+String(r.id||'').slice(-3).toUpperCase();}
function reqOpen(r){return r.status==='open'||r.status==='accepted'||r.status==='returned'||r.status==='done';}
function reqDue(r){return pd(r.due);}
function reqLate(r){const d=reqDue(r);return (r.status==='open'||r.status==='accepted')&&d&&d<today();}
function reqEvents(r){return Object.values(r.ev||{}).sort((a,b)=>String(a.at).localeCompare(String(b.at)));}
function reqUrl(r){return D.appUrl+'#q-'+r.id;}
async function reqWrite(id,patch){const r=store.reqs.find(x=>x.id===id);
 if(store.mode==='local'){if(r){deepMerge(r,patch);try{localStorage.setItem(QKEY,JSON.stringify(store.reqs));}catch(e){}}render();return true;}
 try{if(r)deepMerge(r,patch);await store.db.collection('requests').doc(id).update(patch);return true;}catch(e){flash('保存できませんでした（'+(e.code||'error')+'）。',true);return false;}}
async function reqCreate(doc){const id='q'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
 if(store.mode==='local'){store.reqs.unshift(Object.assign({id},doc));try{localStorage.setItem(QKEY,JSON.stringify(store.reqs));}catch(e){}return id;}
 try{await store.db.collection('requests').doc(id).set(doc);return id;}catch(e){flash('依頼を出せませんでした（'+(e.code||'error')+'）。',true);return null;}}
function evOf(type,text){const k='e'+Date.now().toString(36);return {[k]:{at:new Date().toISOString(),by:store.me||'',name:UI.me||'',type,text:text||''}};}
function reqNotify(r,to,text){return postNotice({id:'',name:'依頼 '+reqNo(r)+'：'+r.title,link:'q-'+r.id},to,text,'req');}
function reqLw(r){const c=r.caseId&&store.cases.find(x=>x.id===r.caseId);const lk=(r.links||[]).filter(l=>okUrl(l.url));
